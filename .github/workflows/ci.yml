name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight runs when a new push lands on the same ref. Saves CI minutes
# during rapid-fire agent commits without affecting main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check workspaces
        run: pnpm type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run vitest across workspaces
        run: pnpm test

  # Light schema lint — drizzle-kit `check` flags missing migrations vs
  # current schema. Catches "agent edited schema, forgot to generate" PRs.
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Schema check (no migration drift)
        working-directory: packages/db
        run: pnpm exec drizzle-kit check
        # `check` is a no-op when there are no migrations yet; keeps CI green
        # on a freshly-initialised repo. Once `migrations/` is populated this
        # job becomes a real drift detector.
        continue-on-error: true
